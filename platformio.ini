; Kachel — Guition ESP32-4848S040C_I (ESP32-S3, 480x480 ST7701S, GT911)
; Board def vendored in boards/ from rzeldent/platformio-espressif32-sunton
; @ commit 0d9a9b1 (CIY1 variant; relay defines unused, display config identical
; across CIY1/CIY3 — see AGENTS.md).

[platformio]
default_envs = kachel

[env:kachel]
platform = espressif32@7.0.1
framework = arduino
board = esp32-4848S040CIY1

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
upload_port = /dev/cu.usbserial-110
upload_speed = 460800
monitor_port = /dev/cu.usbserial-110

build_flags =
    -Ofast
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    '-D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h'

lib_deps =
    ; pinned to main commit matching vendored board JSON @ 0d9a9b1
    ; (registry 2.1.0 predates the DISPLAY_* define rename)
    https://github.com/rzeldent/esp32-smartdisplay.git#20c728e46784df5ad8d027025dca030b353584d1
    lvgl/lvgl@9.2.2
